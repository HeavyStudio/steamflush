<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="SteamFlush Logo" class="site-logo">
        <span class="site-title">{{ site.title }}</span>
      </a>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ 'now' | date: "%Y" }} Jonathan Alfonso • Released under the GPL-3.0 License</p>
      <p style="margin-top: 8px; font-size: 0.85rem;">
        <a href="https://github.com/heavystudio/steamflush">GitHub Repository</a> • 
        <a href="https://github.com/heavystudio/steamflush/issues">Report an Issue</a>
      </p>
    </div>
  </footer>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" class="lightbox-content" alt="Enlarged screenshot">
  </div>

  <script>
    function openLightbox(imgElement) {
      const modal = document.getElementById('lightbox');
      const modalImg = document.getElementById('lightbox-img');
      modal.style.display = 'flex';
      modalImg.src = imgElement.src;
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
